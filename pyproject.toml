[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyper-downloader"
version = "4.1.0"
description = "Baixador de musica do YouTube com separacao de faixas por silencio (CLI + Web)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "yt-dlp>=2024.1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hyperdl-youtube = "hyperdl.cli.youtube:main"
hyperdl-split = "hyperdl.cli.split:main"
hyperdl-server = "hyperdl.api.server:main"

[tool.setuptools.packages.find]
include = ["hyperdl*"]

[tool.setuptools.package-data]
"hyperdl.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
